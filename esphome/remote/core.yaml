# =====================================================================
# CORE - always required
# Board, display, touch, battery, deep sleep, battery indicator and the
# navigation bar (its buttons are added by the individual pages).
# No need to edit this file.
# =====================================================================

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - script.execute: build_ui
        - delay: 4s
        - script.execute: boot_batt

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  cpu_frequency: 160MHz   # saves power: 240 MHz is not needed for this UI
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    # After waking up HA connects a few seconds later: as soon as it does, re-read every state
    - delay: 1s
    - script.execute: refresh_all

ota:
  - platform: esphome

# With deep sleep the power cycles are short: a boot counts as "good" after 8 s,
# otherwise ESPHome would enter safe mode after 10 consecutive wake-ups.
safe_mode:
  boot_is_good_after: 8s

deep_sleep:
  id: deep_sleep_1
  wakeup_pin:
    number: GPIO17          # touch INT (FT6336U): low while touched
    inverted: true
    allow_other_uses: true
  wakeup_pin_mode: KEEP_AWAKE   # if a finger is still on the screen, wait until it is lifted

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE    # awake only ~25 s at a time: faster connection and response
  fast_connect: true
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

globals:
  # Page currently shown (lets the navigation bar highlight the right button)
  - id: active_page
    type: std::string
    initial_value: '""'
  # Battery state (charging is estimated: the board does not route the CHRG pin to the MCU).
  # Kept in flash to compare them on wake-up after deep sleep.
  - id: bat_prev_v
    type: float
    restore_value: yes
    initial_value: '0'
  - id: bat_charging
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: keep_awake
    type: bool
    initial_value: 'false'

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

i2c:
  sda: GPIO16
  scl: GPIO15
  scan: true

output:
  - platform: ledc
    pin: GPIO45
    id: backlight_output

light:
  - platform: monochromatic
    output: backlight_output
    id: backlight
    name: "Backlight"
    restore_mode: RESTORE_AND_ON   # always turns back on, at the brightness chosen in Settings
    default_transition_length: 0s

display:
  - platform: ili9xxx
    model: ili9341
    id: tft
    cs_pin: GPIO10
    dc_pin: GPIO46
    dimensions:
      width: 240
      height: 320
    invert_colors: true
    color_order: BGR
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: ft63x6
    id: touch
    display: tft
    interrupt_pin:
      number: GPIO17
      allow_other_uses: true
    reset_pin: GPIO18
    # Portrait: no transform. If Y comes out inverted
    # (you touch the top, the bottom reacts) add:
    #   transform:
    #     mirror_y: true
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: backlight

# --- Battery: 200k/200k divider on GPIO9 (Freenove schematic, BAT_ADC) ---
sensor:
  - platform: adc
    pin: GPIO9
    id: bat_v_raw
    attenuation: 12db
    samples: 16
    update_interval: 1s
    internal: true
    filters:
      - multiply: 2.0          # 1:2 divider
      - sliding_window_moving_average:
          window_size: 6
          send_every: 1
    on_value:
      then:
        - script.execute: refresh_batt
  - platform: template
    id: bat_v
    name: "Battery voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    update_interval: 30s
    lambda: 'return id(bat_v_raw).state;'
  - platform: template
    id: bat_pct
    name: "Battery"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      float v = id(bat_v_raw).state;
      if (std::isnan(v)) return NAN;
      static const float V[] = {4.20, 4.15, 4.11, 4.08, 4.02, 3.98, 3.95, 3.91, 3.87, 3.84, 3.79, 3.73, 3.50, 3.30};
      static const float P[] = {100,  93,   87,   80,   70,   60,   50,   40,   30,   20,   10,   5,    2,    0};
      if (v >= V[0]) return 100;
      for (int i = 1; i < 14; i++) {
        if (v >= V[i]) return P[i] + (P[i-1] - P[i]) * (v - V[i]) / (V[i-1] - V[i]);
      }
      return 0;

# "Charging" estimate: rising voltage (or >= 4.19 V) = charging; falling = not.
interval:
  - interval: 60s
    then:
      - lambda: |-
          float v = id(bat_v_raw).state;
          if (std::isnan(v)) return;
          float d = v - id(bat_prev_v);
          if (id(bat_prev_v) > 0) {
            if (d > 0.004f) id(bat_charging) = true;
            else if (d < -0.004f) id(bat_charging) = false;
          }
          if (v >= 4.19f) id(bat_charging) = true;
          id(bat_prev_v) = v;
      - script.execute: refresh_batt

script:
  # --- "Hook" scripts: pages and entities append their own actions to them (id: !extend) ---
  # On boot: move buttons, tiles and cards into their containers
  - id: build_ui
    then:
      - logger.log: {level: VERBOSE, format: "Building UI"}
  # On connection to HA: sync everything with the real state
  - id: refresh_all
    then:
      - logger.log: {level: VERBOSE, format: "Refreshing states"}
  # On page change: highlight the right button in the bottom bar
  - id: nav_refresh
    then:
      - logger.log: {level: VERBOSE, format: "Navigation"}

  # On wake-up: compare the voltage with the one saved before sleeping.
  # Jump up (> 0.03 V) = charger connected; jump down = charger removed.
  - id: boot_batt
    then:
      - lambda: |-
          float v = id(bat_v_raw).state;
          if (!std::isnan(v)) {
            float d = v - id(bat_prev_v);
            if (id(bat_prev_v) > 0) {
              if (d > 0.03f) id(bat_charging) = true;
              else if (d < -0.03f) id(bat_charging) = false;
            }
            if (v >= 4.19f) id(bat_charging) = true;
            id(bat_prev_v) = v;
          }
      - component.update: bat_v
      - component.update: bat_pct
      - script.execute: refresh_batt

  - id: go_to_sleep
    then:
      - lambda: |-
          float v = id(bat_v_raw).state;
          if (!std::isnan(v)) id(bat_prev_v) = v;
      - light.turn_off: backlight
      - delay: 300ms
      - deep_sleep.enter: deep_sleep_1

  - id: refresh_batt
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_batt
          text: !lambda |-
            float p = id(bat_pct).state;
            if (std::isnan(p)) return std::string("--");
            const char *ic = p >= 88 ? "\xEF\x89\x80" : p >= 63 ? "\xEF\x89\x81" : p >= 38 ? "\xEF\x89\x82" : p >= 13 ? "\xEF\x89\x83" : "\xEF\x89\x84";
            char buf[40];
            snprintf(buf, sizeof(buf), "%s%s%s %.0f%%", id(keep_awake) ? "\xE2\x80\xA2 " : "", id(bat_charging) ? "\xEF\x83\xA7 " : "", ic, p);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_batt
          text_color: !lambda |-
            float p = id(bat_pct).state;
            if (id(bat_charging)) return lv_color_hex(0x4CAF50);
            if (!std::isnan(p) && p <= 15) return lv_color_hex(0xE5484D);
            return lv_color_hex(0x7F8B97);

font:
  # Fonts are downloaded by ESPHome on the first compile (internet needed on the HA server).
  # Icons (Material Design Icons) get one small font per element, declared by the page or entity itself.
  - file: "gfonts://Montserrat@700"
    id: mont_b20
    size: 20
  - file: "gfonts://Montserrat@700"
    id: mont_b14
    size: 14

lvgl:
  log_level: WARN
  bg_color: 0x0E1116
  text_color: 0xE7EBF0
  buffer_size: 25%
  resume_on_input: false
  on_idle:
    timeout: 20s
    then:
      - if:
          condition:
            lambda: 'return id(keep_awake);'
          then:
            - light.turn_off: backlight
            - lvgl.pause:
          else:
            - script.execute: go_to_sleep

  style_definitions:
    - id: st_btn
      bg_color: 0x1A212A
      bg_opa: COVER
      border_color: 0x2A3441
      border_width: 1
      radius: 14
      shadow_width: 0
      text_color: 0x9AA5B1
    - id: st_nav
      bg_color: 0x0E1116
      bg_opa: COVER
      border_width: 0
      radius: 0
      shadow_width: 0
      text_color: 0x7F8B97
    # Invisible container (grids and lists that adapt to the number of items)
    - id: st_container
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0

  top_layer:
    widgets:
      - label:
          id: lbl_batt
          text: "--"
          text_font: montserrat_14
          text_color: 0x7F8B97
          align: TOP_RIGHT
          x: -8
          y: 9
          clickable: true
          on_click:
            - lambda: 'id(keep_awake) = !id(keep_awake);'
            - script.execute: refresh_batt
      # Navigation bar: page buttons are inserted here, in package order
      - obj:
          id: nav_bar
          align: BOTTOM_MID
          width: 240
          height: 46
          styles: st_container
          bg_color: 0x0E1116
          bg_opa: COVER
          scrollable: false
          layout:
            type: flex
            flex_flow: ROW
            flex_align_main: SPACE_EVENLY
            flex_align_cross: CENTER
            flex_align_track: CENTER
            pad_column: 0
          widgets: []   # filled on boot
